  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE RED CARD RUMBLE: LAYBA vs FARIHA</title>
    <style>
        /* === RESET & FOUNDATION === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Secular One', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none; /* Prevents text highlighting during crazy tapping */
            -webkit-tap-highlight-color: transparent; /* Fix for mobile tap highlight */
        }

        @import url('https://fonts.googleapis.com/css2?family=Secular+One&display=swap');

        :root {
            --bg-color: #050000;
            --main-red: #e60000;
            --dark-red: #800000;
            --neon-pink: #ff007f;
            --neon-blue: #00ffff;
            --white: #ffffff;
            --card-shadow: 0 10px 30px rgba(230, 0, 0, 0.5);
            --neon-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }

        body {
            background-color: var(--bg-color);
            color: var(--white);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* No scrollbars for a true app feel */
            position: relative;
        }

        /* === FLASHING BACKGROUND EFFECTS === */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--main-red);
            opacity: 0;
            z-index: 9999;
            pointer-events: none; /* Let clicks pass through */
        }

        @keyframes flashBad {
            0% { opacity: 0; }
            10%, 30%, 50% { opacity: 0.9; background-color: var(--main-red); }
            20%, 40% { opacity: 0.1; }
            100% { opacity: 0; }
        }

        @keyframes flashGood {
            0% { opacity: 0; }
            10%, 30%, 50% { opacity: 0.8; background-color: var(--neon-pink); }
            20%, 40% { opacity: 0.1; }
            100% { opacity: 0; }
        }

        /* === MAIN CONTAINER === */
        #main-container {
            width: 100%;
            max-width: 500px; /* Looks great on mobile/tablets */
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* === HEADER / SCOREBOARD === */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--white);
            text-shadow: var(--neon-shadow);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        #scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .score-box {
            flex: 1;
            background: linear-gradient(145deg, #1a0000, #0a0000);
            border: 2px solid var(--dark-red);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .score-box.active-player {
            border-color: var(--neon-pink);
            box-shadow: var(--neon-shadow);
            transform: scale(1.05);
        }

        .player-name {
            font-size: 1rem;
            text-transform: uppercase;
            color: #ccc;
            margin-bottom: 5px;
        }

        .player-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--white);
        }

        #player1-box .player-score { text-shadow: 0 0 10px var(--neon-pink); }
        #player2-box .player-score { text-shadow: 0 0 10px var(--neon-blue); }

        /* === THE GAME CARD === */
        #game-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Needed for 3D flip effect */
            margin-bottom: 20px;
        }

        #rumble-card {
            width: 100%;
            height: 350px;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        #rumble-card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            backface-visibility: hidden; /* Hide back when flipped */
            box-shadow: var(--card-shadow);
            border: 4px solid var(--main-red);
        }

        /* CARD FRONT (Questions) */
        .card-front {
            background: linear-gradient(135deg, #2b0000 0%, #660000 100%);
        }

        .turn-indicator {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--neon-blue);
        }

        .question-text {
            font-size: 1.5rem;
            line-height: 1.4;
            color: var(--white);
            margin-bottom: 20px;
        }

        .tap-instruction {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            position: absolute;
            bottom: 20px;
        }

        /* CARD BACK (Penalties) */
        .card-back {
            background: linear-gradient(135deg, #cc0000 0%, #ff1a1a 100%);
            transform: rotateY(180deg); /* Start flipped */
            border-color: var(--white);
        }

        .penalty-header {
            font-size: 2rem;
            text-transform: uppercase;
            color: var(--white);
            background-color: var(--bg-color);
            padding: 5px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .penalty-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--bg-color);
            line-height: 1.3;
        }

        /* === RESPONSE BUTTONS === */
        #controls-area {
            height: 80px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            visibility: hidden; /* Hidden until card is tapped */
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #controls-area.visible {
            visibility: visible;
            opacity: 1;
        }

        .game-btn {
            flex: 1;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--white);
        }

        .game-btn:active {
            transform: scale(0.95);
        }

        #btn-got-it {
            background-color: var(--neon-pink);
            box-shadow: 0 4px 0 #b30059, 0 5px 15px rgba(255, 0, 127, 0.4);
        }

        #btn-wrong {
            background-color: var(--main-red);
            box-shadow: 0 4px 0 #990000, 0 5px 15px rgba(230, 0, 0, 0.4);
        }

        /* === GAME OVER OVERLAY === */
        #game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        #winner-text {
            font-size: 2.5rem;
            color: var(--white);
            text-shadow: var(--neon-shadow);
            margin-bottom: 30px;
        }

        /* === RESPONSIVE TWEAKS === */
        @media (max-height: 600px) {
            #rumble-card { height: 280px; }
            .question-text { font-size: 1.2rem; }
            .penalty-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Red/Pink Flashing Effect -->
    <div id="flash-overlay"></div>

    <div id="main-container">
        <header>
            <h1>Red Card Rumble</h1>
            <div id="scoreboard">
                <div id="player1-box" class="score-box active-player">
                    <div class="player-name">Layba</div>
                    <div id="p1-score" class="player-score">0</div>
                </div>
                <div id="player2-box" class="score-box">
                    <div class="player-name">Fariha</div>
                    <div id="p2-score" class="player-score">0</div>
                </div>
            </div>
        </header>

        <div id="game-area">
            <div id="rumble-card">
                <!-- FRONT: QUESTION -->
                <div class="card-face card-front">
                    <div id="turn-text" class="turn-indicator">Layba's Turn</div>
                    <p id="question-content" class="question-text">Loading wild question...</p>
                    <p class="tap-instruction">TAP TO REVEAL TRUTH</p>
                </div>
                <!-- BACK: PENALTY -->
                <div class="card-face card-back">
                    <div class="penalty-header">Penalty!</div>
                    <p id="penalty-content" class="penalty-text">Loading nasty penalty...</p>
                    <p class="tap-instruction" style="color: rgba(0,0,0,0.5);">TAP TO CONTINUE</p>
                </div>
            </div>
        </div>

        <div id="controls-area">
            <button id="btn-wrong" class="game-btn">Wrong / Lied</button>
            <button id="btn-got-it" class="game-btn">Got It Right!</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-overlay">
        <p id="winner-text">FARIHA WINS!</p>
        <button class="game-btn btn-gradient" style="background: var(--gradient-main); padding: 15px 30px; max-width: 300px;" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        /* === GAME CONFIGURATION === */
        // Layba must answer questions about Fariha, and vice versa.
        // You can add inside jokes here easily. Keep quotes simple and short.
        const questions = [
            { question: "What is [OTHER_PLAYER]'s absolute worst habit that drives you crazy?", playerAbout: "cousin" },
            { question: "Describe [OTHER_PLAYER]'s celebrity crush and why it's embarrassing.", playerAbout: "cousin" },
            { question: "What is the funniest thing you and [OTHER_PLAYER] have done that Fariha's bf doesn't know about?", playerAbout: "both" },
            { question: "If [OTHER_PLAYER] was a flavor of ice cream, what would they be and why?", playerAbout: "cousin" },
            { question: "What is the one song that always makes [OTHER_PLAYER] dance, no matter where they are?", playerAbout: "cousin" },
            { question: "Who is more likely to bring up an embarrassing memory from childhood?", playerAbout: "both" },
            { question: "What was [OTHER_PLAYER]'s first impression of Fariha's current boyfriend?", playerAbout: "cousin" },
            { question: "If you could change ONE thing about [OTHER_PLAYER]'s fashion sense, what would it be?", playerAbout: "cousin" },
            { question: "Who is the 'bad influence' in this friendship?", playerAbout: "both" },
            { question: "Tell the story of the biggest fight you and [OTHER_PLAYER] ever had.", playerAbout: "both" }
        ];

        // "Nasty" but guidelines-safe penalties
        const penalties = [
            "Do 10 pushups while shouting '[OTHER_PLAYER] is the queen!'",
            "Text Fariha's bf an embarrassing photo of yourself right now.",
            "Let [OTHER_PLAYER] scroll through your photo gallery for 30 seconds.",
            "Call a random contact and sing 'Baby Shark' until they hang up.",
            "Do your best impression of Fariha's bf trying to flirt.",
            "Eat a spoonful of something spicy or gross from the fridge.",
            "Let [OTHER_PLAYER] do your makeup for the next round (blindfolded).",
            "Post a silly selfie with the caption 'I lost the Red Card Rumble' on your story.",
            "Spin around 10 times then try to walk in a straight line.",
            "Whisper a dark secret to [OTHER_PLAYER] right now."
        ];

        const WINNING_SCORE = 5;

        /* === GAME STATE & ELEMENT VARIABLES === */
        let gameState = {
            activePlayer: 1, // 1 = Layba, 2 = Fariha
            playerNames: ["Layba", "Fariha"],
            scores: [0, 0],
            currentQuestionIndex: 0,
            currentPenaltyIndex: 0,
            cardFlipped: false
        };

        const els = {
            flash: document.getElementById('flash-overlay'),
            p1Box: document.getElementById('player1-box'),
            p2Box: document.getElementById('player2-box'),
            p1Score: document.getElementById('p1-score'),
            p2Score: document.getElementById('p2-score'),
            card: document.getElementById('rumble-card'),
            turnText: document.getElementById('turn-text'),
            questionText: document.getElementById('question-content'),
            penaltyText: document.getElementById('penalty-content'),
            controls: document.getElementById('controls-area'),
            btnWrong: document.getElementById('btn-wrong'),
            btnRight: document.getElementById('btn-got-it'),
            gameOver: document.getElementById('game-over-overlay'),
            winnerText: document.getElementById('winner-text')
        };

        /* === SHUFFLE ALGORITHMS === */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[array[j]]] = [array[array[j]], array[i]];
            }
        }

        /* === GAME FUNCTIONS === */
        function initGame() {
            shuffleArray(questions);
            shuffleArray(penalties);
            showNewQuestion();
        }

        function showNewQuestion() {
            // Update turn display
            const currentPlayerName = gameState.playerNames[gameState.activePlayer - 1];
            els.turnText.innerText = `${currentPlayerName}'s Turn`;
            els.turnText.style.color = (gameState.activePlayer === 1) ? 'var(--neon-pink)' : 'var(--neon-blue)';

            // Set question content
            const questionData = questions[gameState.currentQuestionIndex];
            const otherPlayerName = (gameState.activePlayer === 1) ? gameState.playerNames[1] : gameState.playerNames[0];
            let qText = questionData.question.replace("[OTHER_PLAYER]", otherPlayerName);
            els.questionText.innerText = qText;

            // Prepare penalty content (hidden on card back)
            let pText = penalties[gameState.currentPenaltyIndex].replace("[OTHER_PLAYER]", otherPlayerName);
            els.penaltyText.innerText = pText;

            // Increment indices for next round
            gameState.currentQuestionIndex = (gameState.currentQuestionIndex + 1) % questions.length;
            gameState.currentPenaltyIndex = (gameState.currentPenaltyIndex + 1) % penalties.length;
        }

        function triggerFlash(type) {
            els.flash.style.animation = 'none';
            els.flash.offsetHeight; // Trigger reflow
            els.flash.style.animation = (type === 'good') ? 'flashGood 1s' : 'flashBad 1.5s';
        }

        function handleScore(points) {
            gameState.scores[gameState.activePlayer - 1] += points;
            els.p1Score.innerText = gameState.scores[0];
            els.p2Score.innerText = gameState.scores[1];

            // Check for winner
            if (gameState.scores[gameState.activePlayer - 1] >= WINNING_SCORE) {
                const winner = gameState.playerNames[gameState.activePlayer - 1];
                els.winnerText.innerText = `${winner.toUpperCase()} WINS!`;
                els.winnerText.style.color = (gameState.activePlayer === 1) ? 'var(--neon-pink)' : 'var(--neon-blue)';
                els.gameOver.style.display = 'flex';
                return true; // Game over
            }
            return false;
        }

        function nextTurn() {
            // Switch active player
            gameState.activePlayer = (gameState.activePlayer === 1) ? 2 : 1;
            els.p1Box.classList.toggle('active-player');
            els.p2Box.classList.toggle('active-player');

            // Set up next question
            showNewQuestion();
        }

        /* === EVENT LISTENERS === */

        // 1. Tap card to reveal buttons (Got It / Wrong)
        els.card.addEventListener('click', () => {
            if (!gameState.cardFlipped) {
                // Front side tap: just show controls
                els.controls.classList.add('visible');
            } else {
                // Back side tap: user has read penalty, continue
                els.card.classList.remove('is-flipped');
                gameState.cardFlipped = false;
                nextTurn();
            }
        });

        // 2. Handle "Got It Right!" (Score point)
        els.btnRight.addEventListener('click', () => {
            triggerFlash('good');
            els.controls.classList.remove('visible');
            if (!handleScore(1)) {
                nextTurn();
            }
        });

        // 3. Handle "Wrong / Lied" (Trigger Penalty Card)
        els.btnWrong.addEventListener('click', () => {
            triggerFlash('bad');
            els.controls.classList.remove('visible');
            
            // Flip card to back (Penalty)
            els.card.classList.add('is-flipped');
            gameState.cardFlipped = true;
            // No score change
        });

        // Start everything
        initGame();

    </script>
</body>
</html>
